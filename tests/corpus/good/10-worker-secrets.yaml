apiVersion: v1
kind: Namespace
metadata:
  name: jobs
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: jobs
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: jobs
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: worker-credentials
  namespace: jobs
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  dataFrom:
    - extract:
        key: prod/worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: jobs
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.example.com/jobs/worker:5.0.3@sha256:4444444444444444444444444444444444444444444444444444444444444444
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUEUE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worker-credentials
                  key: queue-token
            - name: LOG_FORMAT
              value: json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: jobs
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: worker
